pluginGroup = com.quantumtemplates
pluginVersion = 1.4.0

# Oldest Rider build the plugin installs into (262 = 2026.2). Keep this in step with platformVersion:
# the build targets the Java/Kotlin versions of the SDK it compiles against.
pluginSinceBuild = 262

# Rider SDK to compile against. If platformLocalPath points at an existing Rider install it is used directly;
# otherwise the SDK for platformVersion is downloaded (several GB, cached after the first build).
platformVersion = 2026.2
platformLocalPath = C:/Program Files/JetBrains/JetBrains Rider 2026.2.0.2

# Rider provides the Kotlin standard library, so don't bundle another copy in the plugin.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
